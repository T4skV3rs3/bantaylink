name: BantayLink Alpha Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate required files
        run: |
          set -e
          test -f index.html
          test -f README.md
          test -f ARCHITECTURE.md
          test -f ADAPTERS.md
          test -f SOURCES.md
          test -f package.json
          test -f db/schema.sql
          test -f data/schema.json
          test -f data/seed.json
          test -f src/adapters/registry.js
          test -f src/ingestion/engine.js
          test -f src/ingestion/hash.js
          test -f src/ingestion/csv.js
          test -f src/ingestion/http.js
          test -f src/db/memory.js
          test -f src/db/postgres.js
          test -f src/adapters/openhalalan.js
          test -f src/adapters/dpwh.js
          test -f src/adapters/dpwh-efoi.js
          test -f src/adapters/da-sidlan.js
          test -f src/adapters/coa-elibrary.js
          test -f src/adapters/philgeps.js
          test -f scripts/test-adapters.mjs
          test -f scripts/ingest-source.mjs
          test -f src/entity-resolution/rules.js
          test -f src/entity-resolution/engine.js
          test -f scripts/test-entity-resolution.mjs
          test -f api/entities.js
          test -f api/entity.js
          test -f api/evidence.js
          test -f api/entity-resolution.js
          test -f src/correlation/engine.js
          test -f src/correlation/rules.js
          test -f scripts/test-correlation.mjs
          test -f scripts/run-correlation.mjs
          test -f index.html

      - name: Syntax-check ingestion and correlation code
        run: |
          node --check src/ingestion/engine.js
          node --check src/ingestion/http.js
          node --check src/adapters/da-sidlan.js
          node --check src/adapters/coa-elibrary.js
          node --check src/adapters/philgeps.js
          node --check src/adapters/openhalalan.js
          node --check src/adapters/dpwh.js
          node --check src/adapters/dpwh-efoi.js
          node --check src/db/memory.js
          node --check src/db/postgres.js
          node --check scripts/test-ingestion.mjs
          node --check scripts/test-adapters.mjs
          node --check src/entity-resolution/rules.js
          node --check src/entity-resolution/engine.js
          node --check api/evidence.js
          node --check api/entity-resolution.js
          node --check api/entities.js
          node --check api/entity.js
          node --check scripts/test-entity-resolution.mjs
          node --check src/correlation/rules.js
          node --check src/correlation/engine.js
          node --check scripts/test-correlation.mjs
          node --check scripts/run-correlation.mjs
          node --check api/correlations.js

      - name: Syntax-check browser UI script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/bantaylink-index.js").write_text(script)
          PY
          node --check /tmp/bantaylink-index.js

      - name: Validate JSON
        run: |
          python3 -m json.tool data/schema.json >/dev/null
          python3 -m json.tool data/seed.json >/dev/null

      - name: Test ingestion, adapters, entity resolution, and correlation engine
        run: npm test
        env:
          NODE_OPTIONS: --unhandled-rejections=strict

      - name: Smoke-check UI anchors
        run: |
          grep -q "Trace the record" index.html
          grep -q "Infrastructure watch" index.html
          grep -q "Political families" index.html
          grep -q "Correlations" index.html
          grep -q "Evidence" index.html
          grep -q "Entity resolution" index.html
          echo "BantayLink alpha smoke checks passed."
