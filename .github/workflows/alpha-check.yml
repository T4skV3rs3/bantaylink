name: BantayLink Alpha Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate required files
        run: |
          set -e
          test -f index.html
          test -f README.md
          test -f ARCHITECTURE.md
          test -f ADAPTERS.md
          test -f SOURCES.md
          test -f package.json
          test -f db/schema.sql
          test -f data/schema.json
          test -f data/seed.json
          test -f src/adapters/registry.js
          test -f src/ingestion/engine.js
          test -f src/ingestion/hash.js
          test -f src/ingestion/csv.js
          test -f src/ingestion/http.js
          test -f src/db/memory.js
          test -f src/db/postgres.js
          test -f src/adapters/openhalalan.js
          test -f src/adapters/dpwh.js
          test -f src/adapters/dpwh-efoi.js
          test -f scripts/test-adapters.mjs
          test -f scripts/ingest-source.mjs
          test -f src/correlation/engine.js
          test -f src/correlation/rules.js
          test -f scripts/test-correlation.mjs
          test -f scripts/run-correlation.mjs
          test -f api/correlations.js

      - name: Syntax-check correlation code
        run: |
          node --check src/correlation/rules.js
          node --check src/correlation/engine.js
          node --check src/db/postgres.js
          node --check scripts/test-correlation.mjs
          node --check scripts/run-correlation.mjs
          node --check api/correlations.js

      - name: Validate JSON
        run: |
          python3 -m json.tool data/schema.json >/dev/null
          python3 -m json.tool data/seed.json >/dev/null

      - name: Test ingestion, adapters, and correlation engine
        run: npm test

      - name: Smoke-check UI anchors
        run: |
          grep -q "Trace the record" index.html
          grep -q "Infrastructure watch" index.html
          grep -q "Political families" index.html
          grep -q "Correlations" index.html
          echo "BantayLink alpha smoke checks passed."
